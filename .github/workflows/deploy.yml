name: Build, Push, and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Run E2E tests
        run: npm run test:e2e

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for scan
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: local/${{ github.repository }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/${{ github.repository }}:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "================================================"
            echo "Deploying Life Tracker to VPS..."
            echo "================================================"

            echo ""
            echo "Pulling latest image..."
            cd ~/server-config/apps
            docker compose pull life-tracker
            echo "✓ Image pulled successfully"

            echo ""
            echo "Deploying container..."
            docker compose up -d life-tracker
            echo "✓ Container started"

            echo ""
            echo "Verifying deployment..."
            sleep 5

            # Check container status
            if docker compose ps life-tracker | grep -q "Up"; then
              echo "✓ Life Tracker is running"
              docker compose ps life-tracker
            else
              echo "✗ Life Tracker failed to start"
              docker compose ps life-tracker
              docker compose logs --tail=50 life-tracker
              exit 1
            fi

            # Wait for health check
            echo ""
            echo "Waiting for health check..."
            for i in {1..10}; do
              if docker compose ps life-tracker | grep -q "healthy"; then
                echo "✓ Health check passed"
                break
              fi
              if [ $i -eq 10 ]; then
                echo "✗ Health check failed after 10 attempts"
                docker compose logs --tail=50 life-tracker
                exit 1
              fi
              echo "Waiting... (attempt $i/10)"
              sleep 3
            done

            echo ""
            echo "================================================"
            echo "Deployment completed successfully! 🚀"
            echo "================================================"
