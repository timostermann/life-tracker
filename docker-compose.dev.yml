services:
  life-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: life-tracker-dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_PATH=/data/db.sqlite
    volumes:
      - ./.data:/data
    # Container runs as UID 1001 (sveltekit user)
    # Ensure .data directory is writable: chmod 777 .data or chown 1001:1001 .data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  sqlite-web:
    image: coleifer/sqlite-web:latest
    container_name: life-tracker-sqlite-web
    restart: unless-stopped
    command: ['sqlite_web', '--host', '0.0.0.0', '--port', '8080', '/data/db.sqlite']
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./.data:/data
    depends_on:
      life-tracker:
        condition: service_healthy
